version: 2
updates:
  # Workspace root: the single root package-lock.json covers every workspace
  # member (language, cli, ct_module, editors/*), so one entry manages them all.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Babel 8 removed the `loose`/`spec` preset-env options that ct_module's
    # vite build relies on to emit ES5 for Rhino. Bumping across that major
    # changes the emitted JS and can only be validated in-game, so hold it out
    # of the automated group; do the loose->assumptions migration in its own PR.
    ignore:
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        applies-to: version-updates
        dependency-type: development
      prod-dependencies:
        applies-to: version-updates
        dependency-type: production
      security:
        applies-to: security-updates
        patterns:
          - "*"

  # mcp is a standalone package, not part of the npm workspace.
  - package-ecosystem: npm
    directory: /mcp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        applies-to: version-updates
        dependency-type: development
      prod-dependencies:
        applies-to: version-updates
        dependency-type: production
      security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
