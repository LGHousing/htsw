version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /language
      - /cli
      - /ct_module
      - /editors/common
      - /editors/code
      - /editors/monaco
      - /scripts
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Babel 8 removed the `loose`/`spec` preset-env options that ct_module's
    # vite build relies on to emit ES5 for Rhino. Bumping across that major
    # changes the emitted JS and can only be validated in-game, so hold it out
    # of the automated group; do the loose->assumptions migration in its own PR.
    ignore:
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        applies-to: version-updates
        dependency-type: development
      prod-dependencies:
        applies-to: version-updates
        dependency-type: production
      security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
