version: 2
updates:
  - package-ecosystem: npm
    directory: /ct_module
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Vite 8 bundles with rolldown/oxc, whose minifier and chunk wrappers emit
      # ES2019+ syntax (optional catch binding, const) that CT's Rhino can't parse.
      # The babel ES5 pipeline only works on the rollup-based vite 7.
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: "@rollup/plugin-babel"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
      prod-dependencies:
        dependency-type: production

  - package-ecosystem: npm
    directory: /cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      prod-dependencies:
        dependency-type: production

  - package-ecosystem: npm
    directory: /mcp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      prod-dependencies:
        dependency-type: production

  - package-ecosystem: npm
    directory: /language
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      prod-dependencies:
        dependency-type: production

  - package-ecosystem: npm
    directory: /editors/common
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      prod-dependencies:
        dependency-type: production

  - package-ecosystem: npm
    directory: /editors/monaco
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      prod-dependencies:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
