name: Deploy Docs
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'book.toml'
      - 'language/src/**'
      - 'language/package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install mdBook
        run: |
          curl -LsSf https://github.com/rust-lang/mdBook/releases/download/v0.5.3/mdbook-v0.5.3-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv mdbook /usr/local/bin/mdbook
          mdbook --version

      - name: Install dependencies
        run: npm ci

      - name: Build language package
        run: npm run build --workspace language

      - name: Bundle HTSW runtime for playground
        run: |
          npx esbuild docs/theme/htsw-playground-runner.js \
            --bundle --format=iife --global-name=htswPlayground \
            --outfile=docs/htsw-playground-runner.bundle.js \
            '--resolve-extensions=.js,.ts'

      - name: Build book
        run: mdbook build

      - name: Publish docs to VM
        env:
          DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.HTSW_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.HTSW_DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.HTSW_DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "${DEPLOY_KEY}" ]; then
            echo "::notice::DOCS_DEPLOY_KEY secret not set; skipping docs publish."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${DEPLOY_KEY}" > ~/.ssh/htsw-docs-deploy
          chmod 600 ~/.ssh/htsw-docs-deploy
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > ~/.ssh/htsw-docs-deploy-known-hosts
          mkdir -p dist-docs && cp -r book dist-docs/htsw
          tar -C dist-docs -cf - htsw | ssh \
            -i ~/.ssh/htsw-docs-deploy \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile=~/.ssh/htsw-docs-deploy-known-hosts \
            "${DEPLOY_USER}@${DEPLOY_HOST}" deploy
