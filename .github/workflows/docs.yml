name: Deploy Docs
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'book.toml'
      - 'language/src/**'
      - 'language/package.json'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.3'

      - name: Build language package
        run: |
          cd language
          npm install
          npm run build

      - name: Bundle HTSW runtime for playground
        run: |
          npx esbuild docs/theme/htsw-playground-runner.js \
            --bundle --format=iife --global-name=htswPlayground \
            --outfile=docs/htsw-playground-runner.bundle.js \
            --resolve-extensions=.js,.ts

      - name: Build book
        run: mdbook build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book
