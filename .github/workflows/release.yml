name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update, for example v0.5.0"
        required: true
      notes:
        description: "Plain-English release notes for users; 2-4 short lines, no changelog-only markdown"
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build language package
        run: npm run build --workspace language

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Ensure release tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            git tag "${TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Resolve release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
          INPUT_NOTES: ${{ github.event.inputs.notes || '' }}
        run: |
          notes="${INPUT_NOTES}"
          if [ -z "${notes//[[:space:]]/}" ]; then
            notes="$(gh release view "${TAG}" --json body --jq '.body // ""' 2>/dev/null || true)"
          fi
          if [ -z "${notes//[[:space:]]/}" ]; then
            echo "::error::Release notes are required. Use 2-4 plain-English lines that describe the important user-visible changes."
            exit 1
          fi

          {
            echo "notes<<EOF"
            echo "${notes}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Stage release artifacts
        env:
          HTSW_RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          HTSW_RELEASE_NOTES: ${{ steps.notes.outputs.notes }}
        run: python publish.py --no-upload

      # Publishes the staged feeds to the autoupdater VM through a deploy key
      # whose authorized_keys entry forces ~/bin/htsw-deploy on the server —
      # the key can install feed files under /var/www/htsw and nothing else.
      - name: Publish autoupdater feeds
        id: deploy
        env:
          DEPLOY_KEY: ${{ secrets.HTSW_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.HTSW_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.HTSW_DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.HTSW_DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "${DEPLOY_KEY}" ]; then
            echo "::notice::HTSW_DEPLOY_KEY secret not set; skipping autoupdater publish."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${DEPLOY_KEY}" > ~/.ssh/htsw-deploy
          chmod 600 ~/.ssh/htsw-deploy
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > ~/.ssh/htsw-deploy-known-hosts
          tar -C dist-publish -cf - ct vscode | ssh \
            -i ~/.ssh/htsw-deploy \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile=~/.ssh/htsw-deploy-known-hosts \
            "${DEPLOY_USER}@${DEPLOY_HOST}" deploy
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Prepare GitHub release assets
        run: |
          cp dist-publish/ct/latest.json dist-publish/htsw-ct-latest.json
          cp dist-publish/vscode/latest.json dist-publish/htsw-vscode-latest.json

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --title "HTSW ${TAG}" \
              --notes "${NOTES}"
          else
            gh release create "${TAG}" \
              --title "HTSW ${TAG}" \
              --notes "${NOTES}"
          fi

          gh release upload "${TAG}" \
            dist-publish/ct/htsw-ct-*.zip \
            dist-publish/vscode/*.vsix \
            dist-publish/htsw-ct-latest.json \
            dist-publish/htsw-vscode-latest.json \
            --clobber

      # Users update through the VM-backed feeds, not the GitHub release. When
      # the deploy step ran, a stale feed means the deploy silently failed —
      # fail the run. When the deploy was skipped (no secret), warn instead so
      # a tagged-but-never-published release can't slip by silently again
      # (v0.6.5 did exactly that).
      - name: Check autoupdater feeds match this release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          DEPLOYED: ${{ steps.deploy.outputs.deployed }}
        run: |
          ct_repo="$(jq -r .version ct_module/package.json)"
          vs_repo="$(jq -r .version editors/code/package.json)"
          ct_live="$(curl -sf https://legendarygames.dev/htsw/ct/latest.json | jq -r .version || echo unreachable)"
          vs_live="$(curl -sf https://legendarygames.dev/htsw/vscode/latest.json | jq -r .version || echo unreachable)"

          {
            echo "## Autoupdater feeds"
            echo "| surface | repo version | live feed |"
            echo "|---|---|---|"
            echo "| CT module | ${ct_repo} | ${ct_live} |"
            echo "| VS Code extension | ${vs_repo} | ${vs_live} |"
          } >> "$GITHUB_STEP_SUMMARY"

          level="warning"
          if [ "${DEPLOYED}" = "true" ]; then level="error"; fi
          failed=0
          if [ "${ct_live}" != "${ct_repo}" ]; then
            echo "::${level} title=CT autoupdater is behind::${TAG} has module version ${ct_repo}, but https://legendarygames.dev/htsw/ct/latest.json serves ${ct_live}. Users running /htsw update will NOT get this release. Manual fix: python publish.py --ct-only"
            failed=1
          fi
          if [ "${vs_live}" != "${vs_repo}" ]; then
            echo "::${level} title=VS Code updater is behind::editors/code is at ${vs_repo}, but https://legendarygames.dev/htsw/vscode/latest.json serves ${vs_live}. Manual fix: python publish.py --vscode-only"
            failed=1
          fi
          if [ "${DEPLOYED}" = "true" ] && [ "${failed}" = "1" ]; then exit 1; fi
