name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update, for example v0.5.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build language package
        run: npm run build --workspace language

      - name: Stage release artifacts
        run: python publish.py --no-upload

      - name: Prepare GitHub release assets
        run: |
          cp dist-publish/ct/latest.json dist-publish/htsw-ct-latest.json
          cp dist-publish/vscode/latest.json dist-publish/htsw-vscode-latest.json

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            git tag "${TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${TAG}"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --title "HTSW ${TAG}" \
              --notes "Automated HTSW release for ${TAG}."
          else
            gh release create "${TAG}" \
              --title "HTSW ${TAG}" \
              --notes "Automated HTSW release for ${TAG}."
          fi

          gh release upload "${TAG}" \
            dist-publish/ct/htsw-ct-*.zip \
            dist-publish/vscode/*.vsix \
            dist-publish/htsw-ct-latest.json \
            dist-publish/htsw-vscode-latest.json \
            --clobber
