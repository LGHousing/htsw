name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update, for example v0.9.9"
        required: true
      notes:
        description: "Plain-English release notes for users; 2-4 short lines"
        required: false
      vscode_notes:
        description: "Optional VS Code-specific notes"
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            language/package-lock.json
            editors/common/package-lock.json
            ct_module/package-lock.json
            cli/package-lock.json
            editors/code/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: |
          npm ci --prefix language
          npm ci --prefix editors/common
          npm ci --prefix ct_module
          npm ci --prefix cli
          npm ci --prefix editors/code

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Resolve release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          INPUT_NOTES: ${{ github.event.inputs.notes || '' }}
        run: |
          notes="${INPUT_NOTES}"
          if [ -z "${notes//[[:space:]]/}" ]; then
            notes="$(gh release view "${TAG}" --json body --jq '.body // ""' 2>/dev/null || true)"
          fi
          if [ -z "${notes//[[:space:]]/}" ]; then
            echo "::error::Release notes are required. Use 2-4 plain-English lines describing the important user-visible changes."
            exit 1
          fi
          {
            echo "notes<<EOF"
            echo "${notes}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          HTSW_DEPLOY_KEY: ${{ secrets.HTSW_DEPLOY_KEY }}
          HTSW_DEPLOY_HOST: ${{ secrets.HTSW_DEPLOY_HOST }}
          HTSW_DEPLOY_USER: ${{ secrets.HTSW_DEPLOY_USER }}
          HTSW_DEPLOY_KNOWN_HOSTS: ${{ secrets.HTSW_DEPLOY_KNOWN_HOSTS }}
          HTSW_RELEASE_NOTES: ${{ steps.notes.outputs.notes }}
          HTSW_RELEASE_NOTES_VSCODE: ${{ github.event.inputs.vscode_notes || '' }}
        run: python scripts/publish.py release --tag "${{ steps.tag.outputs.tag }}"
